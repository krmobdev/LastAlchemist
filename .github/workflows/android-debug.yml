name: Android Debug APK

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Configure Godot Android settings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cat > /tmp/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed 's/^          //' /tmp/editor_settings-4.3.tres > ~/.config/godot/editor_settings-4.3.tres

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/last-alchemist-godot
            ~/.local/share/godot/export_templates/4.3.stable
          key: godot-4.3.stable-android-v2

      - name: Install Godot 4.3 and templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/last-alchemist-godot ~/.local/share/godot/export_templates/4.3.stable
          if [ ! -x ~/.cache/last-alchemist-godot/godot ]; then
            curl -fL --retry 3 --retry-all-errors 'https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip' -o /tmp/godot.zip
            unzip -q /tmp/godot.zip -d /tmp/godot
            install -m 0755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 ~/.cache/last-alchemist-godot/godot
          fi
          if [ ! -s ~/.local/share/godot/export_templates/4.3.stable/android_debug.apk ]; then
            curl -fL --retry 3 --retry-all-errors 'https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz' -o /tmp/templates.tpz
            rm -rf /tmp/godot_templates && mkdir -p /tmp/godot_templates
            unzip -q /tmp/templates.tpz -d /tmp/godot_templates
            cp /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          fi
          ~/.cache/last-alchemist-godot/godot --version

      - name: Import project
        run: ~/.cache/last-alchemist-godot/godot --headless --editor --quit --path .

      - name: Export Android debug APK
        run: |
          mkdir -p build
          ~/.cache/last-alchemist-godot/godot --headless --verbose --path . --export-debug "Android Debug" build/LastAlchemist-debug.apk

      - name: Verify APK
        run: |
          test -s build/LastAlchemist-debug.apk
          file build/LastAlchemist-debug.apk
          ls -lh build/LastAlchemist-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LastAlchemist-debug-apk
          path: build/LastAlchemist-debug.apk
          if-no-files-found: error
