name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.tres'
      - '**.json'
      - '**.svg'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

env:
  GODOT_VERSION: 4.3
  GODOT_VERSION_FULL: 4.3.stable

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/last-alchemist-godot
            ~/.local/share/godot/export_templates/4.3.stable
          key: godot-${{ env.GODOT_VERSION_FULL }}-android-v1

      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/last-alchemist-godot
          if [ ! -x ~/.cache/last-alchemist-godot/godot ]; then
            curl -fL --retry 3 --retry-all-errors \
              'https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=4.3' \
              -o /tmp/godot.zip
            unzip -q /tmp/godot.zip -d /tmp/godot
            install -m 0755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 ~/.cache/last-alchemist-godot/godot
          fi
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          if [ ! -f ~/.local/share/godot/export_templates/4.3.stable/android_debug.apk ]; then
            curl -fL --retry 3 --retry-all-errors \
              'https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=4.3' \
              -o /tmp/templates.tpz
            rm -rf /tmp/godot_templates
            mkdir -p /tmp/godot_templates
            unzip -q /tmp/templates.tpz -d /tmp/godot_templates
            cp /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          fi
          ~/.cache/last-alchemist-godot/godot --version
          test -s ~/.local/share/godot/export_templates/4.3.stable/android_debug.apk

      - name: Import project
        run: ~/.cache/last-alchemist-godot/godot --headless --editor --quit --path .

      - name: Export Android debug APK
        run: |
          mkdir -p build
          ~/.cache/last-alchemist-godot/godot --headless --path . --export-debug "Android Debug" build/LastAlchemist-debug.apk

      - name: Verify APK
        run: |
          test -s build/LastAlchemist-debug.apk
          file build/LastAlchemist-debug.apk
          ls -lh build/LastAlchemist-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LastAlchemist-debug-apk
          path: build/LastAlchemist-debug.apk
          if-no-files-found: error
